[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-studio"
version = "2.16.11.6"
description = "API-first MuJoCo mechanism modeling, simulation and agent studio"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "passlib>=1.7,<2",
  "mujoco>=3.1,<4",
]

[project.optional-dependencies]
simulation = ["trimesh>=4.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
markers = ["no_auto_auth: exercise unauthenticated or explicit-role behavior"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
